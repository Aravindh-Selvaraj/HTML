<!DOCTYPE html>
<html>
<head>
    <title>Symposium Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        form {
            background-color: white;
            width: 350px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
        }
    </style>
</head>

<body>

<form>
    <h2>Symposium Registration</h2>

    Name:
    <input type="text" name="name" required>

    Email:
    <input type="email" name="email" required>

    Phone Number:
    <input type="tel" name="phone">

    Gender:<br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female

    <br><br>

    Department:
    <select name="department">
        <option>MCA</option>
        <option>MBA</option>
        <option>BCA</option>
        <option>B.Sc</option>
    </select>

    Events:<br>
    <input type="checkbox" name="event" value="Quiz"> Quiz
    <input type="checkbox" name="event" value="Coding"> Coding
    <input type="checkbox" name="event" value="Paper"> Paper Presentation

    <br><br>

    Date:
    <input type="date" name="date">

    Upload File:
    <input type="file" name="file">

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

</form>

</body>
</html>
